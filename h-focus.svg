  <g class="shoot" style="animation-delay:6.5s;animation-duration:8s"><line x1="760" y1="14" x2="650" y2="-24" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/><circle cx="760" cy="14" r="2.2" fill="#fff"/></g>
  <g transform="translate(790 -14)"><g class="sway" style="transform-origin:20px 98px;--a:2deg;animation-duration:5.6s"><image href="data:image/png;base64," width="41" height="98"/></g></g>
