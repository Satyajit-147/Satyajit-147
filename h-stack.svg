<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 78" width="1000" height="78">
<defs>
  <linearGradient id="trail" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b1030" stop-opacity=".88"/><stop offset=".45" stop-color="#1b1030" stop-opacity=".45"/><stop offset="1" stop-color="#1b1030" stop-opacity=".05"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc9a8"/><stop offset="1" stop-color="#f5a8d0"/></linearGradient>
  <clipPath id="c"><rect width="1000" height="78" rx="12"/></clipPath>
