<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040812"/><stop offset=".6" stop-color="#07101f"/><stop offset="1" stop-color="#0a1428"/></linearGradient>
  <radialGradient id="core" cx=".5" cy=".3" r=".45"><stop offset="0" stop-color="#1f6feb" stop-opacity=".35"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient>
  <linearGradient id="pulseL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset="1" stop-color="#a5d6ff"/></linearGradient>
  <linearGradient id="pulseR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset="1" stop-color="#a5d6ff"/></linearGradient>
  <linearGradient id="edges" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#040812"/><stop offset=".08" stop-color="#040812" stop-opacity="0"/><stop offset=".92" stop-color="#040812" stop-opacity="0"/><stop offset="1" stop-color="#040812"/></linearGradient>
  <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#132447"/><stop offset="1" stop-color="#0a1428"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="tglow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
