  <g class="shoot" style="animation-delay:5.2s;animation-duration:8s"><line x1="720" y1="14" x2="610" y2="-24" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/><circle cx="720" cy="14" r="2.2" fill="#fff"/></g>
  <g transform="translate(820 -14)"><g class="sway" style="transform-origin:14px 98px;--a:2deg;animation-duration:6.6s"><image href="data:image/png;base64," width="29" height="98"/></g></g>
