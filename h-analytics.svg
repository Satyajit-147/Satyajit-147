<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 78" width="1000" height="78">
<defs>
  <linearGradient id="trail" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b1030" stop-opacity=".88"/><stop offset=".45" stop-color="#1b1030" stop-opacity=".45"/><stop offset="1" stop-color="#1b1030" stop-opacity=".05"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc9a8"/><stop offset="1" stop-color="#f5a8d0"/></linearGradient>
  <clipPath id="c"><rect width="1000" height="78" rx="12"/></clipPath>
</defs>
<style>
  .tw { animation: tw ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  .sway { animation: sway ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(calc(var(--a) * -1)); } to { transform: rotate(var(--a)); } }
  .shoot { opacity: 0; animation: shoot linear infinite; }
  @keyframes shoot { 0% { opacity: 0; transform: translate(0,0); } 2% { opacity: 1; } 9% { opacity: 0; transform: translate(260px, 90px); } 100% { opacity: 0; transform: translate(260px, 90px); } }
  .fly { opacity: 0; animation: fly ease-in-out infinite; }
  @keyframes fly { 0% { opacity: 0; transform: translate(0,0); } 25% { opacity: .9; } 75% { opacity: .6; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
  .drift { animation: dr 20s ease-in-out infinite alternate; }
  @keyframes dr { from { transform: translateX(0); } to { transform: translateX(-120px); } }
  .pb { transform-box: fill-box; transform-origin: center; animation: pb 2.4s ease-in-out infinite; animation-delay: -1.2s; }
  @keyframes pb { 50% { transform: scaleY(.55); } }
  .t { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 800; font-size: 27px; fill: #fff4fa; }
  .n { font-family: 'JetBrains Mono','Fira Code',Consolas,Menlo,monospace; font-size: 12px; letter-spacing: 3px; fill: #ffc9a8; }
</style>
<g clip-path="url(#c)">
