  <clipPath id="frame"><rect width="1000" height="400" rx="12"/></clipPath>
</defs>
<style>
  .hi { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 700; font-size: 62px; fill: #f0f6fc; }
  .role { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 300; font-size: 26px; fill: #79c0ff; letter-spacing: .5px; }
  .tag { font-family: 'JetBrains Mono','Fira Code',Consolas,Menlo,monospace; font-size: 11px; fill: #3d5a80; letter-spacing: 2px; }
  .breathe { animation: br 3.2s ease-in-out infinite; }
  @keyframes br { 50% { opacity: .45; } }
  .rise { animation: rise 1.2s ease-out both; }
  .rise2 { animation: rise 1.2s ease-out .35s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .joint1 { transform-origin: 496px 140px; animation: j1 5s ease-in-out infinite; }
  .joint2 { transform-origin: 496px 112px; animation: j2 5s ease-in-out infinite; }
  @keyframes j1 { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }
  @keyframes j2 { 0%,100% { transform: rotate(40deg); } 50% { transform: rotate(70deg); } }
  .led { animation: led 1.6s steps(1) infinite; }
  @keyframes led { 50% { opacity: .2; } }
</style>
